databases:
  - name: finview-db
    plan: free
    databaseName: finview
    user: finview

services:
  # Backend API (Python/FastAPI)
  - type: web
    name: finview-api
    runtime: python
    repo: https://github.com/braisntext/FinView.git
    branch: main
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FINVIEW_DATABASE_URL
        fromDatabase:
          name: finview-db
          property: connectionURI
      - key: FINVIEW_SECRET_KEY
        generateValue: true
      - key: FINVIEW_AUTH_SECRET
        sync: false
      - key: FINVIEW_FRONTEND_URL
        value: https://finview-web.onrender.com
      - key: FINVIEW_STRIPE_SECRET_KEY
        sync: false
      - key: FINVIEW_ANTHROPIC_API_KEY
        sync: false

  # Frontend (Next.js)
  - type: web
    name: finview-web
    runtime: node
    repo: https://github.com/braisntext/FinView.git
    branch: main
    plan: free
    rootDir: ./frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: BACKEND_URL
        value: https://finview-api.onrender.com
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://finview-web.onrender.com
