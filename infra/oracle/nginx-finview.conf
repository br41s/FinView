# /etc/nginx/sites-available/finview
# Reverse proxy for FinView API (uvicorn on 127.0.0.1:8000).
# Replace API_DOMAIN with your domain or <public-ip>.nip.io subdomain.

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    # certbot --nginx will rewrite this block to HTTPS with auto-redirect.

    client_max_body_size 25M;  # PDF uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
