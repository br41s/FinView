steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finview-api:$COMMIT_SHA
      - .

  # Fail before anything is published if the suite is red. The image already has
  # every runtime dependency installed, so only pytest is added; /workspace is
  # mounted (and takes over PYTHONPATH) so tests that read cloudbuild.yaml,
  # scripts/ or backend/ see the committed files rather than the image copy.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm \
          --volume /workspace:/workspace \
          --workdir /workspace \
          --env PYTHONPATH=/workspace \
          europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finview-api:$COMMIT_SHA \
          sh -ceu 'pip install --quiet pytest==9.1.1 pytest-asyncio==1.4.0 && python -m pytest backend/tests -q'

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finview-api:$COMMIT_SHA

  # Prove the built image listens on Cloud Run's port before touching the
  # service. SQLite isolates this contract test from Neon availability.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --detach --name finview-api-smoke --publish 8080:8080 \
          --env PORT=8080 \
          --env FINVIEW_ENV=test \
          --env FINVIEW_SECRET_KEY=cloud-build-smoke-secret \
          --env FINVIEW_AUTH_SECRET=cloud-build-smoke-secret \
          --env FINVIEW_DATABASE_URL=sqlite:////tmp/finview-smoke.db \
          --env FINVIEW_REQUEST_SCOPED_RUNTIME=true \
          europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finview-api:$COMMIT_SHA
        for attempt in {1..60}; do
          if docker exec finview-api-smoke python -c \
            'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/health/ready", timeout=2)); assert payload["status"] == "ready" and payload["environment"] == "test" and payload["runtime"] == "request-scoped"'; then
            exit 0
          fi
          sleep 1
        done
        docker logs finview-api-smoke
        exit 1

  # Create a candidate revision with no production traffic. Request-based
  # billing is mandatory: scheduled work executes synchronously in HTTP.
  # The revision is named per build, not per commit. With $SHORT_SHA alone a
  # failed candidate kept its commit's name forever (Cloud Run refuses to delete
  # the latest created revision), so re-running the same commit "deployed" onto
  # the dead revision and reported its old failure: 93b303c, 2026-10-17, after
  # the secret permission that had failed it was already fixed.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - finview-api
      - --region=europe-west1
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/finview-api:$COMMIT_SHA
      - --revision-suffix=$SHORT_SHA-$BUILD_ID
      - --allow-unauthenticated
      - --no-traffic
      - --cpu-throttling
      - --cpu-boost
      - --min=0
      - --max=1
      - --min-instances=0
      - --max-instances=1
      - --memory=1Gi
      - --timeout=1800
      - --startup-probe=httpGet.path=/api/health/ready,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=24
      - --update-env-vars=FINVIEW_ENV=production,FINVIEW_REQUEST_SCOPED_RUNTIME=true
      - --quiet

  # Verify the candidate, shift traffic atomically, verify the public URL, and
  # rollback automatically if the live check fails.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        # Only the newest active build for this trigger may own a rollout. A
        # newer build cancels older ones before any traffic mutation.
        TRIGGER_ID="$$(gcloud builds describe $BUILD_ID \
          --project=$PROJECT_ID --format='value(buildTriggerId)')"
        ACTIVE="$$(gcloud builds list --ongoing --project=$PROJECT_ID \
          --format='json(id,createTime,buildTriggerId)')"
        NEWEST="$$(printf '%s' "$$ACTIVE" | python3 -c \
          'import json, sys; trigger = sys.argv[1]; rows = [row for row in json.load(sys.stdin) if row.get("buildTriggerId") == trigger]; print(max(rows, key=lambda row: row["createTime"])["id"])' \
          "$$TRIGGER_ID")"
        if [ "$$NEWEST" != "$BUILD_ID" ]; then
          echo "Build superseded by $$NEWEST; refusing to start a rollout"
          exit 0
        fi
        OLDER="$$(printf '%s' "$$ACTIVE" | python3 -c \
          'import json, sys; trigger, current = sys.argv[1:]; print(" ".join(row["id"] for row in json.load(sys.stdin) if row.get("buildTriggerId") == trigger and row["id"] != current))' \
          "$$TRIGGER_ID" "$BUILD_ID")"
        for OLD_BUILD in $$OLDER; do
          gcloud builds cancel "$$OLD_BUILD" --project=$PROJECT_ID --quiet
        done
        for OLD_BUILD in $$OLDER; do
          for attempt in {1..60}; do
            STATUS="$$(gcloud builds describe "$$OLD_BUILD" \
              --project=$PROJECT_ID --format='value(status)')"
            if [ "$$STATUS" != "QUEUED" ] && [ "$$STATUS" != "WORKING" ]; then
              break
            fi
            sleep 2
          done
          if [ "$$STATUS" = "QUEUED" ] || [ "$$STATUS" = "WORKING" ]; then
            echo "Older build $$OLD_BUILD did not stop; refusing to change traffic"
            exit 1
          fi
        done

        REVISION="finview-api-$SHORT_SHA-$BUILD_ID"
        PREVIOUS="$$(gcloud run services describe finview-api \
          --project=$PROJECT_ID --region=europe-west1 \
          --format='json(status.traffic)' | python3 -c \
          'import json, sys; rows = json.load(sys.stdin)["status"]["traffic"]; print(next(row["revisionName"] for row in rows if row.get("percent") == 100))')"

        python3 scripts/verify_cloud_run_service.py \
          --project=$PROJECT_ID --region=europe-west1 --service=finview-api \
          --revision="$$REVISION" --phase=candidate

        LATEST="$$(gcloud run services describe finview-api \
          --project=$PROJECT_ID --region=europe-west1 \
          --format='value(status.latestCreatedRevisionName)')"
        if [ "$$LATEST" != "$$REVISION" ]; then
          echo "Deployment superseded by $$LATEST; refusing to change traffic"
          exit 0
        fi

        # Any rollout pauses periodic callers before changing traffic, and must
        # put them back before this step ends. Nothing used to resume them, so
        # every rollout left production without periodicity on a green build:
        # /api/geo/cron, /api/options/agent/cron and /api/zonas-clave/cron were
        # never called again and Ideas, Monitor de opciones and Zonas Clave went
        # quiet with no error anywhere. The resume is an EXIT trap so it also
        # covers the supersession short-circuit, the rollback path and any
        # unexpected failure of this step; a job that does not come back ENABLED
        # fails the build instead of leaving a silent outage behind.
        SCHEDULER_JOBS="geo-intel-cycle geo-intel-audit options-agent-cycle zonas-clave-cycle ibkr-sync-daily"

        resume_periodic_callers() {
          NOT_RUNNING=""
          for JOB in $$SCHEDULER_JOBS; do
            # resume returns FAILED_PRECONDITION on an already-ENABLED job, so
            # the state check below — not the exit code — is the assertion.
            gcloud scheduler jobs resume "$$JOB" \
              --project=$PROJECT_ID --location=europe-west1 --quiet || true
            STATE="$$(gcloud scheduler jobs describe "$$JOB" \
              --project=$PROJECT_ID --location=europe-west1 \
              --format='value(state)' || echo MISSING)"
            if [ "$$STATE" != "ENABLED" ]; then
              NOT_RUNNING="$$NOT_RUNNING $$JOB=$$STATE"
            fi
          done
          if [ -n "$$NOT_RUNNING" ]; then
            echo "Periodic callers are not running after the rollout:$$NOT_RUNNING"
            return 1
          fi
          echo "Periodic callers resumed: $$SCHEDULER_JOBS"
        }
        trap 'resume_periodic_callers || exit 1' EXIT

        for JOB in $$SCHEDULER_JOBS; do
          STATE="$$(gcloud scheduler jobs describe "$$JOB" \
            --project=$PROJECT_ID --location=europe-west1 --format='value(state)')"
          if [ "$$STATE" != "PAUSED" ]; then
            gcloud scheduler jobs pause "$$JOB" \
              --project=$PROJECT_ID --location=europe-west1 --quiet
          fi
        done

        # update-traffic writes spec.traffic before the revision proves it can
        # start. When the startup probe then fails, the command exits non-zero
        # with status.traffic still on $$PREVIOUS but spec.traffic on the failed
        # revision and the service Ready=False -- and every later deploy refuses
        # to run because the spec routes to a revision that cannot serve
        # (b28450be, 2026-09-30). Undo the write only while spec still holds it:
        # anything else means it is not this build's to undo. Callers resume
        # only once the service is back on a serving revision.
        if ! gcloud run services update-traffic finview-api \
          --project=$PROJECT_ID --region=europe-west1 \
          --to-revisions="$$REVISION=100" --quiet; then
          TARGET="$$(gcloud run services describe finview-api \
            --project=$PROJECT_ID --region=europe-west1 \
            --format='json(spec.traffic)' | python3 -c \
            'import json, sys; rows = json.load(sys.stdin).get("spec", {}).get("traffic", []); print(next((row["revisionName"] for row in rows if row.get("percent") == 100 and row.get("revisionName")), ""))')"
          if [ "$$TARGET" != "$$REVISION" ]; then
            echo "Promotion failed; spec.traffic targets $${TARGET:-none}, nothing of this build's to restore"
            exit 1
          fi
          # The state check below, not this exit code, decides the outcome.
          gcloud run services update-traffic finview-api \
            --project=$PROJECT_ID --region=europe-west1 \
            --to-revisions="$$PREVIOUS=100" --quiet || true
          SERVING="$$(gcloud run services describe finview-api \
            --project=$PROJECT_ID --region=europe-west1 \
            --format='json(status.conditions,status.traffic)' | python3 -c \
            'import json, sys; status = json.load(sys.stdin).get("status", {}); ready = any(row.get("type") == "Ready" and row.get("status") == "True" for row in status.get("conditions", [])); print(next((row["revisionName"] for row in status.get("traffic", []) if row.get("percent") == 100), "") if ready else "")')"
          if [ "$$SERVING" != "$$PREVIOUS" ]; then
            trap - EXIT
            echo "Restore to $$PREVIOUS did not converge (serving: $${SERVING:-none}); periodic callers stay paused"
            exit 1
          fi
          echo "Promotion of $$REVISION failed; traffic restored to $$PREVIOUS"
          exit 1
        fi

        LATEST="$$(gcloud run services describe finview-api \
          --project=$PROJECT_ID --region=europe-west1 \
          --format='value(status.latestCreatedRevisionName)')"
        if [ "$$LATEST" != "$$REVISION" ]; then
          echo "Deployment superseded by $$LATEST after promotion; newer build owns verification"
          exit 0
        fi

        if ! python3 scripts/verify_cloud_run_service.py \
          --project=$PROJECT_ID --region=europe-west1 --service=finview-api \
          --revision="$$REVISION" --phase=live; then
          LIVE="$$(gcloud run services describe finview-api \
            --project=$PROJECT_ID --region=europe-west1 \
            --format='json(status.traffic)' | python3 -c \
            'import json, sys; rows = json.load(sys.stdin)["status"]["traffic"]; print(next((row["revisionName"] for row in rows if row.get("percent") == 100), ""))')"
          LATEST="$$(gcloud run services describe finview-api \
            --project=$PROJECT_ID --region=europe-west1 \
            --format='value(status.latestCreatedRevisionName)')"
          if [ "$$LIVE" = "$$REVISION" ] && [ "$$LATEST" = "$$REVISION" ]; then
            gcloud run services update-traffic finview-api \
              --project=$PROJECT_ID --region=europe-west1 \
              --to-revisions="$$PREVIOUS=100" --quiet
          else
            echo "Traffic now belongs to $$LIVE; refusing stale rollback"
          fi
          exit 1
        fi

options:
  logging: CLOUD_LOGGING_ONLY
