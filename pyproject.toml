[project]
name = "finview"
version = "0.1.0"
description = "Personal investment dashboard with broker imports and Spanish IRPF fiscal engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-multipart>=0.0.18",
    "yfinance>=0.2",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "psycopg2-binary>=2.9",
    "stripe>=8.0",
    # Options monitor
    "pandas>=2.0",
    "numpy>=1.26",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "aiohttp>=3.9",
    "slowapi>=0.1.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Declared explicitly, not inherited. Ruff's *default* rule set changes between
# releases: this project was clean on 0.15.7's defaults, and 0.16.8 — which CI
# happily resolved on its first run — turned on enough extra rules to report
# 1040 findings on unchanged code. Naming the rules makes the lint gate a
# decision this repo owns rather than one a resolver makes for it, and a ruff
# upgrade can no longer move the goalposts on its own.
#
# E4/E7/E9 + F is ruff's historical default (pycodestyle errors + Pyflakes) and
# is what the tree is verified clean against. Widening it is welcome, but as its
# own PR with the diff attached: of what 0.16.8 would add, 797 findings are
# FURB157 on Decimal constructors — churn in a fiscal engine, and worth reading
# rather than auto-fixing — while ~34 DTZ (naive datetime) look like genuine bugs
# worth triaging on their own.
#
# Widened on 2026-10-14 with the families that catch real bugs or dead weight and
# whose fixes leave fiscal arithmetic alone: B (flake8-bugbear: exception chaining, zip
# strictness, loop-variable closures), C4 (comprehensions), SIM (simplify), PERF
# (perflint), RUF015 and RUF100 (an unused `noqa` is a lie about the line). The
# tree is clean against them; the 7 B023 hits were triaged and are false positives
# (each closure is only called in the iteration that defines it), kept as `noqa`.
# FURB and DTZ stay out, for the reasons above.
select = ["E4", "E7", "E9", "F", "B", "C4", "SIM", "PERF", "RUF015", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter defaults are calls by design, not shared mutable defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.setuptools.packages.find]
include = ["backend*"]
