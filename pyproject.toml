[project]
name = "finview"
version = "0.1.0"
description = "Personal investment dashboard with broker imports and Spanish IRPF fiscal engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-multipart>=0.0.18",
    "alembic>=1.14",
    "yfinance>=0.2",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "psycopg2-binary>=2.9",
    "stripe>=8.0",
    # Options monitor
    "pandas>=2.0",
    "numpy>=1.26",
    "anthropic>=0.30",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "aiohttp>=3.9",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["backend*"]
