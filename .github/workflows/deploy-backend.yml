name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/748911075551/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions-deployer@finview-brais-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy finview-api \
            --source . \
            --region europe-west1 \
            --project finview-brais-2026 \
            --allow-unauthenticated \
            --quiet
